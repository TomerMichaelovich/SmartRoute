# Price-transparency ingestion for the cheapest-basket feature
# (apps/web/scripts/prices/ingest.ts). Scheduled runs only fire from the default
# branch. The repo is public, so logs are public too: the script never prints
# connection strings, and DATABASE_URL comes from the PRICES_DATABASE_URL secret.
name: prices

on:
  schedule:
    # Times are UTC. Israel is UTC+2/+3; most chains publish PriceFull between
    # 00:00 and 06:00 local, Rami Levy again every ~6h.
    - cron: "30 3 * * *" # ~06:30 IL: Stores + prices
    - cron: "30 10,14,18 * * *" # prices only (diff-based, cheap when unchanged)
  workflow_dispatch:
    inputs:
      mode:
        description: "full | stores | prices"
        default: "full"
      chain:
        description: "comma-separated chain ids (empty = all)"
        default: ""

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace @smartroute/web --include-workspace-root
      - name: Ingest
        working-directory: apps/web
        env:
          DATABASE_URL: ${{ secrets.PRICES_DATABASE_URL }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '30 3 * * *' && 'full' || 'prices') }}
          CHAIN: ${{ inputs.chain }}
        run: npx tsx scripts/prices/ingest.ts --mode="$MODE" ${CHAIN:+--chain="$CHAIN"}
      # Link generic products to the SKUs just ingested (rule-based, free, ~1 min).
      # Admin decisions (source "manual") are never overwritten.
      - name: Link SKUs
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' && inputs.mode == 'full' || github.event.schedule == '30 3 * * *') }}
        working-directory: apps/web
        env:
          DATABASE_URL: ${{ secrets.PRICES_DATABASE_URL }}
        run: npx tsx scripts/prices/link-skus.ts --verifier=rules
      # Coordinates for new branches or changed addresses (OpenStreetMap, 1 req/s; usually
      # nothing to do). Hand-set coordinates from the admin are never overwritten.
      - name: Geocode branches
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' && inputs.mode == 'full' || github.event.schedule == '30 3 * * *') }}
        working-directory: apps/web
        env:
          DATABASE_URL: ${{ secrets.PRICES_DATABASE_URL }}
        run: npx tsx scripts/prices/geocode-branches.ts
